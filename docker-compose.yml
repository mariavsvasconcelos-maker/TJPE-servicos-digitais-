services:
  postgres:
    image: postgres:16-alpine
    container_name: tjpe_validador_db
    restart: unless-stopped
    environment:
      POSTGRES_DB: tjpe_procuracoes_db
      POSTGRES_USER: tjpe_user
      POSTGRES_PASSWORD: tjpe_secret_password
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tjpe_user -d tjpe_procuracoes_db"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
    driver: local
